name: Backend CI/CD

on:
  pull_request:
    paths:
      - "PetSaas.Api/**"
      - "PetSaas.Application/**"
      - "PetSaas.Domain/**"
      - "PetSaas.Infrastructure/**"
      - "PetSaas.UnitTests/**"
      - "PetSaas.IntegrationTests/**"
      - "PetSaas.slnx"
      - ".github/workflows/backend.yml"

  push:
    branches:
      - develop
      - main
    paths:
      - "PetSaas.Api/**"
      - "PetSaas.Application/**"
      - "PetSaas.Domain/**"
      - "PetSaas.Infrastructure/**"
      - "PetSaas.UnitTests/**"
      - "PetSaas.IntegrationTests/**"
      - "PetSaas.slnx"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PetSaas.slnx

      - name: Build
        run: dotnet build PetSaas.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PetSaas.slnx --configuration Release --no-build

  deploy-staging:
    name: Migrate and deploy staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Restore
        run: dotnet restore PetSaas.slnx

      - name: Apply migrations
        run: >
          dotnet ef database update
          --project PetSaas.Infrastructure
          --startup-project PetSaas.Api
          --connection "${{ secrets.DATABASE_CONNECTION_STRING }}"

      - name: Deploy API to Render
        run: >
          curl -fsS -X POST
          "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"