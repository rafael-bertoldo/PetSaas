name: Frontend CI/CD

on:
  pull_request:
    paths:
      - "petsaas.web/**"
      - ".github/workflows/frontend.yml"

  push:
    branches:
      - main
    paths:
      - "petsaas.web/**"
      - ".github/workflows/frontend.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: petsaas.web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: petsaas.web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          PETSAAS_API_URL: http://127.0.0.1:5130
        run: pnpm build

  deploy:
    name: Deploy to Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"